<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro to Embankment Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Metro to Embankment</h1>
        <div class="moon"></div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <p>Controls: Use WASD keys or click to move</p>
            <p>Goal: Walk from the metro to the bench by the river</p>
        </div>
        <div class="game-buttons">
            <button id="resetBtn">Reset Game</button>
            <button id="muteBtn">Mute/Unmute</button>
        </div>
    </div>
    <iframe id="gameMusic" width="0" height="0" src="https://www.youtube.com/embed/7vBqQIxmGOA?enablejsapi=1&autoplay=0&loop=1&controls=0" frameborder="0" allow="autoplay; encrypted-media"></iframe>
    <script src="game.js"></script>
</body>
</html>
